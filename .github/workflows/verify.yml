name: verify

# 这个 workflow 就是 DESIGN.md 与 ASTRYX_MANIFEST.json 里写的那句
# 「CI asserts pnpm gen produces no diff」的载体。此前只有脚本，没有载体，
# 等于「只在有人记得手动跑的时候才生效」。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # tokens/ 与 packages/ 都是纯文件生成，不需要 node_modules；
      # 但保留 install 以便将来加入需要依赖的检查（视觉回归等）。
      - name: Install (best effort)
        run: pnpm install --frozen-lockfile || echo "no dependencies to install"

      - name: 生成物一致性（产物 vs SSOT）
        run: node scripts/generate.mjs --check

      - name: 令牌 lint（值正确性 / 层叠冲突 / 对比度契约 / 已知问题到期）
        run: node scripts/lint-tokens.mjs

      - name: 令牌快照锁（改动是否登记）
        run: node scripts/token-lock.mjs --check

      # 只在 ui/ 被单独 checkout 时自动跳过（它需要同级的 sites/）。
      # 需要站点副本一起检查时，用 workflow_dispatch 在完整工作区里跑。
      - name: 消费者副本漂移
        run: node scripts/check-consumers.mjs

      - name: 字体资产台账 + 字体加载断言
        run: node scripts/check-assets.mjs

      # TY1（发布 CSS）在 ui/ 内自洽；TY2/TY3（消费方编译产物）需要同级 sites/，
      # 单独 checkout 时自动跳过，与 check-consumers 同一约定。
      - name: 排版令牌落地（发布 CSS + 消费方编译产物）
        run: node scripts/check-typography.mjs

      # 视觉回归需要真实浏览器与本机字体，基线绑定平台：
      # 无浏览器或产物缺失时脚本会自动跳过（退出码 0），因此这里安全。
      # 需要在 CI 上真正跑，请先 playwright install chromium 并接受跨平台基线差异。
      - name: 站点视觉回归
        run: node scripts/visual.mjs check
